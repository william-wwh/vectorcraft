# FreeBSD cross-compile and real aarch64 test execution for vectorcraft.
# Points at william-wwh/craft-common-actions@ci/freebsd-cross-final, the fork branch
# under evaluation. Dispatch-only: pushing to any branch never starts a run, so the
# default branch stays quiet while the per-binary timeout profile is collected.
name: FreeBSD Cross Validation

on:
  workflow_dispatch:
    inputs:
      cold-start:
        description: "Skip the Cargo cache restore so the build starts from an empty target/ (the fresh artifacts are still saved)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  freebsd-cross:
    uses: william-wwh/craft-common-actions/.github/workflows/freebsd-cross.yml@ci/freebsd-cross-final
    with:
      architectures: '["x86_64","aarch64"]'
      cold-start: ${{ inputs.cold-start }}
      skip-tests: false
      run-package-check: true
      app-name: vectorcraft
      require-craft-fonts: true
      craft-fonts-ref: a71c20e30af613287c504f7e685ca8fad77752bc
      per-case-trace: true
